<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeadItNow — 马上变豆 拼豆素材生成器</title>
  <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="app-header" style="display:flex;align-items:center;justify-content:space-between">
      <h1 style="margin:0">BeadItNow</h1>
      <div class="header-actions">
          <span id="userStatus" class="hidden"></span>
          <div id="userDropdown" class="user-dropdown hidden">
            <div class="user-dropdown-header"><span id="dropdownEmail"></span></div>
            <div class="user-dropdown-item" onclick="showSaveDialog()">保存作品</div>
            <div class="user-dropdown-item" onclick="showLoadDialog()">我的作品</div>
            <div class="user-dropdown-divider"></div>
            <div class="user-dropdown-item user-dropdown-exit" onclick="signOut()">退出登录</div>
          </div>
          <button class="btn btn-sm btn-ghost" id="loginBtn" onclick="showLoginModal()">登录 / 注册</button>
          <button class="btn btn-sm btn-ghost hidden" id="logoutBtn" onclick="signOut()">退出</button>
          <button class="btn btn-sm btn-ghost hidden" id="saveBtn" onclick="showSaveDialog()">保存</button>
          <button class="btn btn-sm btn-ghost hidden" id="loadBtn" onclick="showLoadDialog()">我的作品</button>
        </div>
    </header>

    <div class="page-stack" id="pageStack">
      <!-- Page 1: Upload -->
      <div class="page page-upload" id="pageUpload">
        <section class="module module-upload" id="moduleUpload">
          <div class="upload-hero">
            <h2 class="hero-title">开始创作</h2>
            <p class="hero-subtitle">上传图片 → 生成像素画 → 导出拼豆图纸</p>
          </div>
          <main class="app-main">
            <section class="panel panel-left">
              <div class="upload-area" id="uploadArea">
                <div class="upload-placeholder" id="uploadPlaceholder">
                  <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                  </svg>
                  <p>拖拽图片到此处，或点击上传</p>
                  <span class="upload-hint">支持 JPG / PNG</span>
                </div>
                <div class="upload-preview hidden" id="uploadPreview">
                  <img id="originalImage" alt="预览">
                  <button class="btn btn-sm btn-ghost" id="changeImageBtn">更换图片</button>
                </div>
                <input type="file" id="fileInput" accept="image/jpeg,image/png" hidden>
              </div>
              <div class="image-info hidden" id="imageInfo">
                <span id="imageInfoText"></span>
              </div>
            </section>
            <section class="panel panel-right">
              <div class="controls">
                <h2>参数设置</h2>
                <div class="control-group"><label>像素宽度</label>
                  <div class="segmented" id="pixelWidthGroup">
                    <button class="seg-btn" data-value="32">32</button>
                    <button class="seg-btn active" data-value="48">48</button>
                    <button class="seg-btn" data-value="64">64</button>
                    <button class="seg-btn" data-value="128">128</button>
                    <button class="seg-btn" data-value="256">256</button>
                  </div></div>
                <div class="control-group"><label>品牌色盘</label>
                  <select id="brandSelect">
                    <option value="artkal-5mm">Artkal 5mm S-MIDI (173色)</option>
                    <option value="artkal-2.6mm">Artkal 2.6mm Mini Beads (221色)</option>
                    <option value="perler">Perler 5mm midi (121色)</option>
                    <option value="hama">Hama 5mm midi (93色)</option>
                    <option value="mard">Mard 221 色</option>
                  </select></div>
                <div class="control-group"><label>色彩增强 <span id="saturateVal">1.4</span>x</label>
            <input type="range" id="saturateSlider" min="1.0" max="2.0" step="0.1" value="1.4" style="width:100%"></div>

                <button class="btn btn-primary" id="generateBtn" disabled>
                  <span class="btn-text">生成像素画</span>
                  <span class="btn-loading hidden"><svg class="spinner" width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="31.4 31.4" stroke-linecap="round"/></svg>处理中...</span>
                </button>
              </div>
            </section>
          </main>
        </section>
      </div>

      <!-- Page 2: Editor -->
      <div class="page page-editor" id="pageEditor">
        <section class="module module-editor" id="moduleEditor" style="display:none">
          <div class="result-area" id="resultArea">
            <div class="result-section">
              <div class="canvas-with-palette">
                <div class="palette-sidebar">
                  <div class="palette-sidebar-header">
                    <h3>拼豆色盘</h3>
                    <span class="section-hint">点击选色</span>
                    <label class="bead-map-toggle">
                      <input type="checkbox" id="beadMappingToggle" checked>
                      <span>映射</span>
                    </label>
                  </div>
                  <div class="bead-palette" id="beadPalette"></div>
                </div>
                <div class="canvas-main">
                  <div class="preview-header">
                    <h2>像素画预览</h2>
                    <span class="canvas-info hidden" id="canvasInfo"></span>
                  </div>
                  <div class="pixel-canvas-wrapper" id="pixelCanvasWrapper">
                    <canvas id="pixelCanvas"></canvas>
                  </div>
                  <div class="edit-toolbar hidden" id="editToolbar">
                    <div class="tool-group">
                      <button class="tool-btn active" id="toolPencil" title="画笔 (B)">&#9998;</button>
                      <button class="tool-btn" id="toolEraser" title="橡皮擦 (E)">&#9673;</button>
                      <button class="tool-btn" id="toolFill" title="填充 (F)">&#9632;</button>
                      <div class="tool-divider"></div>
                      <div class="current-color" id="currentColor"></div>
                    </div>
                    <button class="tool-btn" id="zoomOut" title="缩小">-</button>
                    <span class="zoom-label" id="zoomLabel">自动</span>
                    <button class="tool-btn" id="zoomIn" title="放大">+</button>
                    <div class="tool-divider"></div>
                    <span class="edit-hint">画笔[B] 填充[F] 橡皮[E] 左键涂色 右键取色 空格拖拽 Ctrl+Z撤销</span>
                    <button class="btn btn-sm btn-ghost" id="undoBtn">撤销</button><button class="tool-btn" id="lockBtn" title="锁定页面，防止误触翻页" style="display:none">🔓</button><button class="tool-btn" id="resetViewBtn" title="复位画布" style="display:none">⌖</button></div>
                  <div class="status-bar" id="statusBar">
                    <span class="status-item" id="statusTool"></span>
                    <span class="status-sep">|</span>
                    <span class="status-item" id="statusPos">X: - Y: -</span>
                    <span class="status-sep">|</span>
                    <span class="status-item" id="statusCanvas"></span>
                    <span class="status-sep">|</span>
                    <span class="status-item" id="statusZoom"></span>
                  </div>
                </div>
              </div>
            </div>
            <div class="result-section">
              <h2>使用的颜色</h2>
              <div class="palette" id="palette"></div>
            </div>
            <div class="result-section">
              <h2>导出</h2>
              <div class="export-buttons">
                <button class="btn btn-export" id="exportPngBtn">&#128196; 下载像素图 PNG</button>
                <button class="btn btn-export" id="exportPdfBtn">&#128203; 下载拼豆图纸 PDF</button>
                <button class="btn btn-export" id="exportCsvBtn">&#128211; 下载颜色清单 CSV</button>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script src="js/color-table.js?v=3"></script>
  <script src="js/image-processor.js?v=3"></script>
  <script src="js/perler-mapper.js?v=3"></script>
  <script src="js/exporter.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
  <script src="js/user.js?v=3"></script>
    <div class="modal-overlay" id="loginModal" style="display:none" onclick="if(event.target===this)closeLoginModal()">
    <div class="modal-box">
      <div class="modal-header"><h2 id="authTitle">登录</h2><button class="btn btn-sm btn-ghost" onclick="closeLoginModal()">✕</button></div>
      <div class="modal-body">
        <form id="authForm" onsubmit="submitAuth();return false">
        <div class="control-group"><label>邮箱</label><input type="email" id="authEmail" class="form-input" placeholder="your@email.com" required></div>
        <div class="control-group"><label>密码</label><input type="password" id="authPassword" class="form-input" placeholder="至少6位" required></div>
        <button type="submit" class="btn btn-primary" id="authSubmitBtn" style="width:100%;margin-top:8px">登录</button>
        </form>
        <p id="authToggle" data-mode="login" style="text-align:center;margin-top:12px;font-size:0.8rem;color:var(--text2)">没有账号？<a href="#" onclick="toggleAuthMode();return false">注册</a></p>
      </div>
    </div>
  </div>
  <div class="modal-overlay" id="loadModal" style="display:none" onclick="if(event.target===this)closeLoadModal()">
    <div class="modal-box">
      <div class="modal-header"><h2>我的作品</h2><button class="btn btn-sm btn-ghost" onclick="closeLoadModal()">✕</button></div>
      <div class="modal-body" id="projectList" style="max-height:400px;overflow-y:auto"><p style="text-align:center;color:var(--text2);padding:20px">加载中...</p></div>
    </div>
  </div>
  <div class="modal-overlay" id="saveModal" style="display:none" onclick="if(event.target===this)closeSaveModal()">
    <div class="modal-box">
      <div class="modal-header"><h2>保存作品</h2><button class="btn btn-sm btn-ghost" onclick="closeSaveModal()">✕</button></div>
      <div class="modal-body">
        <form onsubmit="confirmSave();return false">
        <div class="control-group"><label>作品名称</label><input type="text" id="saveNameInput" class="form-input" placeholder="给你的作品起个名字" value="未命名作品"></div>
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px">保存</button>
        </form>
      </div>
    </div>
  </div>
  <div class="modal-overlay" id="deleteModal" style="display:none" onclick="if(event.target===this)confirmDeleteNo()">
    <div class="modal-box" style="width:320px">
      <div class="modal-header"><h2>确认删除</h2><button class="btn btn-sm btn-ghost" onclick="confirmDeleteNo()">✕</button></div>
      <div class="modal-body">
        <p style="margin:0 0 16px;color:var(--text2);font-size:0.9rem">确定要删除这个作品吗？此操作不可撤销。</p>
        <div style="display:flex;gap:8px">
          <button class="btn btn-ghost" onclick="confirmDeleteNo()" style="flex:1;padding:10px 20px;border:none">取消</button>
          <button class="btn btn-primary" onclick="confirmDeleteYes()" style="flex:1;padding:10px 20px;font-size:0.88rem;background:#e55;border-color:#e55;width:auto;margin-top:0">删除</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
